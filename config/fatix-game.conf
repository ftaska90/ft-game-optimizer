# Custom Mesa/Crocus tree.
MESA_DIR="$HOME/fatix-crocus/mesa"
BUILD_DIR="$HOME/fatix-crocus/build"

# Fatix-Crocus runtime tuning used by the author's setup.
FATIX_PROFILE="balanced"
FATIX_SIMD_HEURISTIC="1"
MESA_LOADER_DRIVER_OVERRIDE="crocus"
vblank_mode="0"

# Fullscreen watcher. 0.25 keeps Alt+Tab recovery responsive without busy polling.
FATIX_GAME_POLL_INTERVAL="0.25"

# Pause GUI applications that are not protected only while the active window is fullscreen.
FATIX_GAME_PAUSE_GUI="1"

# Temporarily disable the XFCE compositor while the launched game is running.
FATIX_GAME_DISABLE_COMPOSITOR="1"

# Stop Fatix assistant and live wallpaper during the game, then restore their previous state.
FATIX_GAME_STOP_FATIX="1"
FATIX_GAME_STOP_LIVEW="1"

# Optional extra process names (extended-regex) that must never receive SIGSTOP.
# Example: FATIX_GAME_EXTRA_PROTECTED='discord|vesktop'
FATIX_GAME_EXTRA_PROTECTED=""
